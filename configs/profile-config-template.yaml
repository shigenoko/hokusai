# ─────────────────────────────────────────────────────────
# クロス LLM レビュー（任意・v0.4.6+ で provider 選択可）
# ─────────────────────────────────────────────────────────
cross_review:
  enabled: false
  # 選択肢: codex / gemini（v0.4.6 以降）
  provider: codex
  model: "<TODO:cross-review モデル、例 codex-mini-latest / gemini-2.5-pro>"
  phases: [2, 4]
  on_failure: warn  # warn | block | skip

# ─────────────────────────────────────────────────────────
# LLM Gateway（Phase 1 log-only / Phase 2 M1.1+ で block 解禁）
# ─────────────────────────────────────────────────────────
# 全 LLM 送信前 interceptor。送信 prompt の hash / context / policy 評価を audit
# log と SQLite (audit_logs) に積み、後段の detector / spend cap / approval gate
# を着手する前に「どの phase / model / provider がどれだけ呼ばれているか」を
# 可視化する。
#
# Phase 2 enforcement のロールアウト戦略（profile 単位で段階導入）:
#   1. 全 profile は **log_only: true** が既定（Phase 1 同等の透過動作）。
#      policy_hits が hit しても decision="log" のまま、audit に積むだけ。
#   2. 自社開発 profile (hokusai) を先行で **log_only: false** に切り替え、
#      policy_hits 非空時に decision="block" / reason="phase2_policy_block"
#      を audit に残す（実 enforcement = dispatch 側で BLOCK を見て実送信を
#      抑止する配線は別 milestone）。
#   3. 案件 profile は **log_only: true** を維持。decision 切替の影響範囲を
#      自社運用に閉じたまま、policy 違反の検出だけ全 profile で続ける。
#
# セクションごと省略可（LLMGatewayConfig のデフォルトが効く）。
llm_gateway:
  enabled: true              # gateway 自体の on/off。false なら interceptor も skip
  log_only: true             # ロールアウト戦略の主スイッチ。詳細は上のコメント参照
  audit_log_enabled: true    # audit log（JSON line + SQLite audit_logs）を出すか
  # dry_run: false           # true なら reason="dry_run_log_only" として audit に残す
  # allowed_providers: [claude_code, codex, gemini]  # 未指定 (None) なら全許可
  # allowed_models:
  #   default: [claude-sonnet-4-6, gpt-4o, gemini-2.5-pro]
  #   high_cost_requires_gate: [claude-opus-4-7]    # hit すると policy_hits に積む
